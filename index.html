<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Absensi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:560px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e8edf4;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 6px 24px #0f172a0b}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-size:21px;font-weight:850}.muted{color:#64748b;font-size:13px}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status>div{background:#f8fafc;border-radius:14px;padding:12px;text-align:center}.time{font-size:22px;font-weight:850}.location{margin-top:10px;padding:11px 12px;background:#f8fafc;border-radius:13px;font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:800;margin-top:9px;cursor:pointer}.btn:disabled{opacity:.45}.in{background:#16a34a;color:#fff}.out{background:#dc2626;color:#fff}.ghost{background:#eef2ff;color:#3730a3}.warn{background:#fff7ed;color:#9a3412}.mini{font-size:12px;padding:9px}.hidden{display:none!important}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:12px;align-items:center;justify-content:center}.modal.on{display:flex}.modalbox{background:#fff;border-radius:20px;width:min(510px,100%);padding:16px}.video{width:100%;aspect-ratio:4/3;background:#0f172a;border-radius:16px;object-fit:cover;transform:scaleX(-1)}.facehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.facehint span{width:60%;aspect-ratio:1;border:2px solid #ffffffbb;border-radius:50%}.facebox{position:relative;margin-top:12px}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:11px 0}.bar{height:100%;width:0;background:#2563eb;transition:width .12s}.notice{padding:12px;border-radius:14px;margin-top:10px;font-size:13px}.notice.outside{background:#fff7ed;color:#9a3412}.notice.inside{background:#ecfdf5;color:#166534}.bench table{width:100%;border-collapse:collapse;font-size:12px}.bench td,.bench th{padding:7px 5px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}.ok{color:#15803d}.bad{color:#b91c1c}.sectionTitle{font-weight:800}.small{font-size:11px}.log{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;background:#0f172a;color:#cbd5e1;border-radius:13px;padding:10px;max-height:210px;overflow:auto;white-space:pre-wrap}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#f1f5f9;font-size:11px;margin-top:5px}.photoPreview{width:100%;border-radius:14px;margin-top:10px}.mapLink{display:inline-block;margin-top:7px;font-size:12px;color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><div><div class="name" id="empName">Absensi</div><div class="muted" id="empInfo">Login untuk mulai</div></div><button class="btn ghost mini" style="width:auto;margin:0" onclick="logout()">Keluar</button></div>
  </div>

  <div id="loginCard" class="card">
    <input id="nik" inputmode="numeric" autocomplete="username" placeholder="NIK" style="width:100%;padding:14px;border:1px solid #dbe3ee;border-radius:13px;margin-bottom:8px">
    <input id="pin" inputmode="numeric" type="password" autocomplete="current-password" placeholder="PIN" style="width:100%;padding:14px;border:1px solid #dbe3ee;border-radius:13px">
    <button id="loginBtn" class="btn in" onclick="login()">Masuk</button>
    <div id="loginMsg" class="muted" style="margin-top:8px"></div>
  </div>

  <div id="mainCard" class="hidden">
    <div class="card">
      <div class="status"><div><div class="muted">Clock In</div><div class="time" id="jamIn">--:--</div></div><div><div class="muted">Clock Out</div><div class="time" id="jamOut">--:--</div></div></div>
      <div class="location" id="gps">GPS siap digunakan saat absensi.</div>
    </div>
    <button id="btnIn" class="btn in" onclick="startAttendance('MASUK')">🟢 CLOCK IN</button>
    <button id="btnOut" class="btn out" onclick="startAttendance('PULANG')">🔴 CLOCK OUT</button>

    <div class="card bench">
      <div class="sectionTitle">Diagnostik kecepatan</div>
      <div class="muted" style="margin:5px 0 10px">Tes ini tidak membuat absensi. Jalankan 2–3 kali dan kirim hasilnya kepada saya.</div>
      <button class="btn ghost mini" onclick="runBenchmark()">Uji Semua Komponen</button>
      <div id="benchOut" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div id="attModal" class="modal"><div class="modalbox">
  <div class="head"><b id="attTitle">Absensi</b><button class="btn ghost mini" style="width:auto;margin:0" onclick="cancelAttendance()">Tutup</button></div>
  <div class="facebox"><video id="video" class="video" autoplay muted playsinline></video><div class="facehint"><span></span></div></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="attNotice" class="notice inside">Mempersiapkan kamera, GPS, dan Face ID.</div>
  <div id="attStatus" class="muted" style="margin-top:8px">Tidak perlu kedip atau senyum.</div>
  <div id="attTiming" class="muted" style="margin-top:6px"></div>
  <div id="attLog" class="log" style="margin-top:8px"></div>
</div></div>

<script>
/* =========================================================
   KONFIGURASI UTAMA
   ========================================================= */
const API_URL='https://script.google.com/macros/s/AKfycbyzjg84LqKfTx0iuoJRRF0Re9CFsiSQ7KysV__u2TqyuPaP5tdYINrrKYbfNtMH8BsK/exec';
const MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const FACE_API_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js';
const BENCHMARK_CONFIG={
  repeat:3,
  serverTimeout:20000,
  gps:{enableHighAccuracy:true,timeout:8000,maximumAge:30000},
  camera:{width:480,height:360},
  face:{inputSize:320,scoreThreshold:.45,maxFrames:30},
  descriptorPhotoQuality:.55,
  storeLocalHistory:true
};

let user=null,stream=null,position=null,officeLocation=null,faceReady=false,currentType='',cancelled=false;
let timings={};
let benchmarkHistory=[];

/* =========================================================
   BENCHMARK CLIENT - semua titik waktu dikumpulkan di sini
   ========================================================= */
const BENCHMARK_SCHEMA=[
  'login.network','login.serverApprox','status.network','profile.network','location.network','location.lookup',
  'face.scriptLoad','face.modelLoad','camera.getUserMedia','camera.videoReady','gps.fix','face.detectDescriptor',
  'evidence.photoEncode','attendance.serverNetwork','attendance.total','benchmark.serverSuiteNetwork','benchmark.serverInternal'
];

function now(){return performance.now()}
function fmt(ms){return Math.round(Number(ms)||0)+' ms'}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function log(s){const e=document.getElementById('attLog');e.textContent+=(e.textContent?'\n':'')+s;e.scrollTop=e.scrollHeight}
function setStatus(s){document.getElementById('attStatus').textContent=s}
function saveBench(){if(!BENCHMARK_CONFIG.storeLocalHistory)return;try{localStorage.setItem('attendanceBenchmarkHistory',JSON.stringify(benchmarkHistory.slice(-20)))}catch(e){}}
function pushBench(label,ms,ok=true,detail=''){const item={label:label,ms:Math.round(Number(ms)||0),ok:!!ok,detail:String(detail||''),at:new Date().toISOString()};benchmarkHistory.push(item);saveBench();return item}
function readBench(){try{benchmarkHistory=JSON.parse(localStorage.getItem('attendanceBenchmarkHistory')||'[]')}catch(e){benchmarkHistory=[]}}
function median(a){const x=a.slice().sort((a,b)=>a-b);return x.length?x[Math.floor(x.length/2)]:0}

/* =========================================================
   SERVER CALL - satu pintu agar network time selalu terukur
   ========================================================= */
function callServer(fn,args=[],timeout=BENCHMARK_CONFIG.serverTimeout){return new Promise((resolve,reject)=>{
  const t=now();let done=false;const timer=setTimeout(()=>{if(!done){done=true;const ms=now()-t;pushBench(fn+'.network',ms,false,'timeout');reject(new Error('Timeout '+fn))}},timeout);
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .then(r=>r.json()).then(j=>{if(done)return;done=true;clearTimeout(timer);const ms=now()-t;pushBench(fn+'.network',ms,!!(j&&j.ok),j&&j.ok?'':'server error');if(j&&j.ok)resolve({result:j.result,ms:ms});else reject(new Error(j&&j.error||'Server error'))})
    .catch(e=>{if(done)return;done=true;clearTimeout(timer);const ms=now()-t;pushBench(fn+'.network',ms,false,e.message);reject(e)})
})}

/* =========================================================
   LOGIN / STATUS / OFFICE CACHE
   ========================================================= */
async function login(){
  const n=document.getElementById('nik').value.trim(),p=document.getElementById('pin').value.trim();if(!n||!p)return;
  const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='Memeriksa...';const t=now();
  try{
    const r=await callServer('login',[n,p],15000);pushBench('login.total',now()-t);
    if(!r.result.success)throw new Error(r.result.message||'Login gagal');
    user={role:r.result.role,employee:r.result.employee};localStorage.setItem('fastAbsensiUser',JSON.stringify(user));showMain();
    await Promise.all([loadStatus(),loadOfficeLocation()]);
  }catch(e){document.getElementById('loginMsg').textContent=e.message}
  finally{b.disabled=false;b.textContent='Masuk'}
}
function loadSession(){readBench();try{const x=JSON.parse(localStorage.getItem('fastAbsensiUser')||'null');if(x&&x.employee&&x.employee.nik){user=x;showMain();Promise.all([loadStatus(),loadOfficeLocation()])}}catch(e){}}
function logout(){localStorage.removeItem('fastAbsensiUser');user=null;officeLocation=null;document.getElementById('mainCard').classList.add('hidden');document.getElementById('loginCard').classList.remove('hidden');document.getElementById('empName').textContent='Absensi';document.getElementById('empInfo').textContent='Login untuk mulai'}
function showMain(){document.getElementById('loginCard').classList.add('hidden');document.getElementById('mainCard').classList.remove('hidden');document.getElementById('empName').textContent=user.employee.nama;document.getElementById('empInfo').textContent=user.employee.nik+' • '+user.role}
async function loadStatus(){try{const r=await callServer('getStatusHariIni',[user.employee.nik]);const s=r.result;document.getElementById('jamIn').textContent=s.jamMasuk||'--:--';document.getElementById('jamOut').textContent=s.jamPulang||'--:--';document.getElementById('btnIn').disabled=!!s.masuk;document.getElementById('btnOut').disabled=!s.masuk||!!s.pulang}catch(e){}}
async function loadOfficeLocation(){
  const t=now();try{officeLocation=(await callServer('getLokasiByBranch',[user.employee.branch])).result;pushBench('location.lookup',now()-t);document.getElementById('gps').textContent='Branch '+user.employee.branch+' • radius '+Math.round(officeLocation.radius)+'m • GPS aktif saat absen'}catch(e){document.getElementById('gps').textContent='Lokasi branch belum tersedia: '+e.message}}

/* =========================================================
   FACE ENGINE - hanya untuk deteksi + descriptor, bukan selfie upload
   ========================================================= */
async function loadFaceApi(){
  if(faceReady)return;
  const tScript=now();
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src=FACE_API_URL;s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat face-api.js'));document.head.appendChild(s)});
  pushBench('face.scriptLoad',now()-tScript);
  const tModel=now();
  await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);
  pushBench('face.modelLoad',now()-tModel);faceReady=true;
}
function getGPS(){return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(new Error('GPS tidak didukung'));
  const t=now();navigator.geolocation.getCurrentPosition(p=>{const ms=now()-t;position={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy};pushBench('gps.fix',ms,true,'±'+Math.round(position.accuracy)+'m');resolve(position)},e=>{const ms=now()-t;pushBench('gps.fix',ms,false,e.message||'GPS gagal');reject(new Error(e.message||'GPS gagal'))},BENCHMARK_CONFIG.gps)
})}
async function startCamera(){
  const t=now();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:BENCHMARK_CONFIG.camera.width},height:{ideal:BENCHMARK_CONFIG.camera.height}},audio:false});pushBench('camera.getUserMedia',now()-t);
  const v=document.getElementById('video');v.srcObject=stream;const t2=now();await v.play();await new Promise(r=>{if(v.readyState>=2)r();else v.onloadeddata=()=>r()});pushBench('camera.videoReady',now()-t2)
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function capturePhoto(){const v=document.getElementById('video'),c=document.createElement('canvas');const w=Math.min(640,v.videoWidth||480),h=Math.round(w*(v.videoHeight||360)/(v.videoWidth||480));c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);const t=now(),photo=c.toDataURL('image/jpeg',BENCHMARK_CONFIG.descriptorPhotoQuality);pushBench('evidence.photoEncode',now()-t,photo.length>0,Math.round(photo.length/1024)+'KB');return photo}
function distanceMeter(lat1,lon1,lat2,lon2){const R=6371000,toRad=Math.PI/180,dLat=(lat2-lat1)*toRad,dLon=(lon2-lon1)*toRad,a=Math.sin(dLat/2)**2+Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
async function detectFace(){
  const v=document.getElementById('video'),opt=new faceapi.TinyFaceDetectorOptions({inputSize:BENCHMARK_CONFIG.face.inputSize,scoreThreshold:BENCHMARK_CONFIG.face.scoreThreshold});
  const t=now();
  for(let i=0;i<BENCHMARK_CONFIG.face.maxFrames;i++){
    if(cancelled)throw new Error('Dibatalkan');
    await new Promise(r=>requestAnimationFrame(r));
    const d=await faceapi.detectSingleFace(v,opt).withFaceLandmarks().withFaceDescriptor();
    if(d&&d.descriptor){const ms=now()-t;pushBench('face.detectDescriptor',ms,true,'frame '+(i+1));return {descriptor:Array.from(d.descriptor)}}
    document.getElementById('bar').style.width=Math.min(68,(i+1)/BENCHMARK_CONFIG.face.maxFrames*68)+'%';
  }
  pushBench('face.detectDescriptor',now()-t,false,'wajah tidak terdeteksi');throw new Error('Wajah belum terdeteksi. Posisikan wajah di dalam lingkaran.')
}

/* =========================================================
   ABSENSI CEPAT
   ========================================================= */
async function startAttendance(type){
  if(!user)return;currentType=type;cancelled=false;timings={};document.getElementById('attModal').classList.add('on');document.getElementById('attLog').textContent='';document.getElementById('bar').style.width='0';
  const t0=now();timings.totalStart=t0;setStatus('Kamera + GPS + Face ID dijalankan bersamaan.');
  try{
    const res=await Promise.allSettled([getGPS(),startCamera(),loadFaceApi()]);
    if(res[0].status!=='fulfilled')throw new Error('GPS: '+res[0].reason.message);if(res[1].status!=='fulfilled')throw new Error('Kamera: '+res[1].reason.message);if(res[2].status!=='fulfilled')throw new Error('Face engine: '+res[2].reason.message);
    document.getElementById('bar').style.width='25%';
    const face=await detectFace();document.getElementById('bar').style.width='72%';
    const distance=officeLocation?distanceMeter(position.latitude,position.longitude,officeLocation.latitude,officeLocation.longitude):null;
    const inOffice=officeLocation&&position.accuracy<=officeLocation.maxAccuracy&&distance<=officeLocation.radius;
    const notice=document.getElementById('attNotice');
    notice.className='notice '+(inOffice?'inside':'outside');
    if(inOffice){
      notice.textContent='✓ Di dalam radius kantor. Tidak ada foto yang di-upload.';
      log('Lokasi kantor: '+Math.round(distance)+'m dari titik kantor.');
    }else{
      notice.textContent='⚠ Di luar radius kantor. Foto bukti akan disertakan untuk approval atasan/HR.';
      log('Lokasi di luar kantor / akurasi tidak memenuhi syarat. Bukti foto akan dikirim.');
    }
    let photo='';if(!inOffice){setStatus('Di luar lokasi kantor. Mengambil foto bukti...');photo=capturePhoto();}
    else setStatus('Wajah terdeteksi. Menyimpan absensi...');
    document.getElementById('bar').style.width='84%';
    const payload={nik:user.employee.nik,tipe:type,latitude:position.latitude,longitude:position.longitude,accuracy:position.accuracy,address:'',faceDescriptor:face.descriptor,foto:photo};
    const ts=now();const r=await callServer('simpanAbsensi',[payload],20000);timings.server=r.ms;pushBench('attendance.serverNetwork',r.ms);
    timings.total=now()-t0;pushBench('attendance.total',timings.total);document.getElementById('bar').style.width='100%';
    log('Server '+fmt(r.ms)+' | TOTAL '+fmt(timings.total));document.getElementById('attTiming').textContent='Total: '+fmt(timings.total)+' • server: '+fmt(r.ms);
    setStatus((r.result&&r.result.message)||'Absensi berhasil.');await loadStatus();setTimeout(cancelAttendance,900);
  }catch(e){timings.total=now()-t0;pushBench('attendance.total',timings.total,false,e.message);log('GAGAL: '+e.message);log('TOTAL '+fmt(timings.total));setStatus(e.message)}finally{stopCamera()}
}
function cancelAttendance(){cancelled=true;stopCamera();document.getElementById('attModal').classList.remove('on')}

/* =========================================================
   BENCHMARK LENGKAP
   - client: network, GPS, camera, face, encoding
   - server: internal Spreadsheet/function time
   ========================================================= */
async function timed(name,fn){const t=now();try{const r=await fn();return {name,ms:Math.round(now()-t),ok:true,result:r}}catch(e){return {name,ms:Math.round(now()-t),ok:false,error:e.message}}}
async function repeatJob(name,fn){const vals=[],errors=[];for(let i=0;i<BENCHMARK_CONFIG.repeat;i++){const r=await timed(name,fn);vals.push(r.ms);if(!r.ok)errors.push(r.error)}return {name,runs:vals,min:Math.min(...vals),median:median(vals),max:Math.max(...vals),errors:errors}}
async function runBenchmark(){
  if(!user)return;const out=document.getElementById('benchOut');out.innerHTML='<div class="muted">Menjalankan benchmark '+BENCHMARK_CONFIG.repeat+'x. Jangan pindah aplikasi.</div>';
  const t0=now();const rows=[];
  rows.push(await repeatJob('API ping',()=>callServer('pingServer')));
  rows.push(await repeatJob('Status hari ini',()=>callServer('getStatusHariIni',[user.employee.nik])));
  rows.push(await repeatJob('Profil karyawan',()=>callServer('getMyProfile',[user.employee.nik])));
  rows.push(await repeatJob('Lokasi kantor',()=>callServer('getLokasiKantor')));
  rows.push(await repeatJob('Lokasi branch',()=>callServer('getLokasiByBranch',[user.employee.branch])));
  rows.push(await repeatJob('Face registration status',()=>callServer('getFaceRegistrationStatus',[user.employee.nik])));
  if(user.role==='HR'||user.role==='ADMIN'){
    rows.push(await repeatJob('Daftar atasan/karyawan',()=>callServer('getKaryawanOptions',[user.role])));
    rows.push(await repeatJob('Ringkasan karyawan',()=>callServer('getKaryawanSummary',[user.role])));
    rows.push(await repeatJob('Dashboard',()=>callServer('getDashboardAdmin',[user.role])));
    rows.push(await repeatJob('Progress Face ID',()=>callServer('getFaceRegistrationProgress',[user.role])));
    rows.push(await repeatJob('Pending approval',()=>callServer('getPendingApprovalsFull',[user.role,user.employee.nik])));
  }
  const serverT=now();let serverSuite=null;try{const r=await callServer('benchmarkServerSuite',[user.employee.nik,user.role],30000);serverSuite=r.result;pushBench('benchmark.serverSuiteNetwork',r.ms);pushBench('benchmark.serverInternal',serverSuite.totalInternalMs)}catch(e){serverSuite={jobs:[],error:e.message}}
  rows.push({name:'Server internal total',runs:[serverSuite.totalInternalMs||0],min:serverSuite.totalInternalMs||0,median:serverSuite.totalInternalMs||0,max:serverSuite.totalInternalMs||0,errors:serverSuite.error?[serverSuite.error]:[]});
  const total=now()-t0;
  let html='<div class="tag">Benchmark total '+fmt(total)+'</div><table><tr><th>Komponen</th><th>Min</th><th>Median</th><th>Max</th></tr>';
  rows.forEach(x=>{html+='<tr><td>'+esc(x.name)+(x.errors.length?' <span class="bad">⚠</span>':'')+'</td><td>'+fmt(x.min)+'</td><td><b>'+fmt(x.median)+'</b></td><td>'+fmt(x.max)+'</td></tr>'});html+='</table>';
  if(serverSuite&&serverSuite.jobs){html+='<div class="sectionTitle" style="margin-top:12px">Waktu internal Apps Script</div><table><tr><th>Fungsi</th><th>Server</th><th>Ukuran hasil</th></tr>';serverSuite.jobs.forEach(x=>{html+='<tr><td>'+esc(x.name)+'</td><td class="'+(x.ok?'ok':'bad')+'">'+fmt(x.ms)+'</td><td>'+esc(x.size||'')+'</td></tr>'});html+='</table>'}
  html+='<div class="muted small" style="margin-top:9px">Kirim screenshot/teks tabel ini + hasil log absensi. Saya akan pisahkan bottleneck perangkat, GPS, face engine, jaringan, Apps Script, Spreadsheet, dan Drive.</div>';
  out.innerHTML=html;
  try{localStorage.setItem('lastFullBenchmark',JSON.stringify({at:new Date().toISOString(),client:rows,server:serverSuite,totalMs:total}))}catch(e){}
}

loadSession();
/* Preload Face ID agar model tidak dihitung setelah tombol absensi ditekan. */
loadFaceApi().catch(e=>console.warn('Face preload:',e));
</script>
</body>
</html>
