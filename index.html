const frames={desktop:document.getElementById('desktopApp'),mobile:document.getElementById('mobileApp')};
const loaded={desktop:false,mobile:false};
function decodeHTML(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function activate(){const key=matchMedia('(max-width: 900px)').matches?'mobile':'desktop';for(const k of ['desktop','mobile'])frames[k].classList.toggle('active',k===key);if(!loaded[key]){frames[key].srcdoc=decodeHTML(sources[key]);loaded[key]=true}}
activate();
const mq=matchMedia('(max-width: 900px)');if(mq.addEventListener)mq.addEventListener('change',activate);else mq.addListener(activate);
</script></body></html>
